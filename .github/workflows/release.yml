name: Build GitHub release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release versions
        run: node -e 'const p=require("./package.json");const m=require("./public/manifest.json");if (`v${p.version}`!==process.env.GITHUB_REF_NAME||m.version!==p.version) process.exit(1)'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:site
      - run: node scripts/package-extension.mjs
      - name: Create checksum
        run: cd release && sha256sum "tabspace-${GITHUB_REF_NAME}.zip" > "tabspace-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: TabSpace ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            release/tabspace-${{ github.ref_name }}.zip
            release/tabspace-${{ github.ref_name }}.zip.sha256
          fail_on_unmatched_files: true
