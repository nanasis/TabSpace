name: Build GitHub release

on:
  push:
    tags:
      - 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release versions
        run: node -e 'const p=require("./package.json");const m=require("./public/manifest.json");if (`v${p.version}`!==process.env.GITHUB_REF_NAME||m.version!==p.version) process.exit(1)'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:site
      - run: node scripts/package-extension.mjs
      - name: Create checksum
        run: sha256sum release/tabspace-v0.1.0.zip > release/tabspace-v0.1.0.zip.sha256
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: TabSpace v0.1.0
          body_path: docs/releases/v0.1.0.md
          files: |
            release/tabspace-v0.1.0.zip
            release/tabspace-v0.1.0.zip.sha256
          fail_on_unmatched_files: true
